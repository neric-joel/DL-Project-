[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "asrshift"
version = "0.1.0"
description = "Does an ASR selective-review policy calibrated on short medical clips stay reliable on doctor-patient conversations?"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
  "faster-whisper==1.2.1",
  "ctranslate2==4.8.2",
  "numpy>=2.0",
  "scipy>=1.13",
  "pandas>=2.2",
  "pyarrow>=16",
  "soundfile>=0.12",
  "jiwer>=4.0,<5",
  "whisper-normalizer==0.1.15",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
  "pyyaml>=6.0",
  "requests>=2.31",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# cuBLAS for the CUDA 12 ctranslate2 wheels; cuDNN is not required for Whisper inference.
gpu = ["nvidia-cublas-cu12==12.9.2.10", "nvidia-cuda-nvrtc-cu12==12.9.86"]
test = ["pytest>=8"]
app = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
asrshift = "asrshift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "data: needs the downloaded datasets (skipped when absent)",
  "gpu: needs a CUDA device",
]
